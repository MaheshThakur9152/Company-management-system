name: Android APK Release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  boss-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build BossJava APK
        working-directory: BossJava
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#app-}"
          cp BossJava/app/build/outputs/apk/release/app-release-unsigned.apk \
             BossApp-${VERSION}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-apk
          path: BossApp-*.apk

  supervisor-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Supervisor APK
        working-directory: supervisor-android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#app-}"
          cp supervisor-android/app/build/outputs/apk/release/app-release-unsigned.apk \
             AmbeSupervisor-${VERSION}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-apk
          path: AmbeSupervisor-*.apk

  release:
    needs: [boss-app, supervisor-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Android Apps ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
