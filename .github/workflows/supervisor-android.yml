name: Supervisor Android APK Release

on:
  push:
    tags:
      - 'supervisor-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Gradle Wrapper exists
        working-directory: supervisor-android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Release APK
        working-directory: supervisor-android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#supervisor-}"
          cp supervisor-android/app/build/outputs/apk/release/app-release-unsigned.apk \
             AmbeSupervisor-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Supervisor App ${{ github.ref_name }}
          generate_release_notes: true
          files: AmbeSupervisor-*.apk
