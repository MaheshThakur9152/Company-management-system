name: BossJava APK Release

on:
  push:
    tags:
      - 'boss-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: BossJava
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: BossJava
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#boss-}"
          cp BossJava/app/build/outputs/apk/release/app-release-unsigned.apk \
             BossApp-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Boss App ${{ github.ref_name }}
          generate_release_notes: true
          files: BossApp-*.apk
