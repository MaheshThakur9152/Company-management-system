<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ambe Boss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F3F5F9;
        color: #1e293b;
        overscroll-behavior: none;
      }
      /* Hide scrollbar by default for clean mobile look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      /* Custom scrollbar for data grids */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(203, 213, 225, 0.8);
        border-radius: 4px;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
      }
      .glass-card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.1);
      }
      .gradient-text {
        background: linear-gradient(to right, #c084fc, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .animate-breathing {
        animation: breathing 4s ease-in-out infinite;
      }
      @keyframes breathing {
        0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 40px rgba(236, 72, 153, 0.6); }
        100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); }
      }
      .animate-wave {
        animation: wave 1s infinite linear;
      }
      @keyframes wave {
        0% { height: 20%; }
        50% { height: 100%; }
        100% { height: 20%; }
      }
    </style>
  <script type="importmap">

    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>

</head>

</body>
</html>
